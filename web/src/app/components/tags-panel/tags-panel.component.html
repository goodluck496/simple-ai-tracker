<p-dialog
  [(visible)]="isOpen"
  (onHide)="close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [style]="{ width: 'min(560px, 94vw)' }"
  header="Реестр тегов"
>
  <div class="tags-panel">
    <div class="tags-add">
      <input
        type="text"
        pInputText
        class="tags-input"
        placeholder="новый тег"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        (keydown.enter)="add()"
      />
      <p-colorpicker [ngModel]="color()" (ngModelChange)="color.set($event)" [inline]="false"></p-colorpicker>
      <p-button label="Добавить" icon="pi pi-plus" size="small" [disabled]="!name().trim()" (onClick)="add()"></p-button>
    </div>

    <ul class="tags-list">
      @for (tag of sortedTags(); track tag.id) {
        <li class="tags-row">
          <p-tag
            [value]="tag.name"
            [styleClass]="'tag-chip'"
            icon="pi pi-hashtag"
            severity="secondary"
            [pTooltip]="'Фильтровать по #' + tag.name"
            (onClick)="filterBy(tag.name)"
          ></p-tag>
          <span class="tag-count" [title]="'Задач с тегом: ' + (tag.tasksCount ?? 0)">{{ tag.tasksCount ?? 0 }}</span>
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            size="small"
            pTooltip="Удалить тег"
            (onClick)="remove(tag.name)"
          ></p-button>
        </li>
      }
      @if (sortedTags().length === 0) {
        <li class="tags-empty">Тегов пока нет.</li>
      }
    </ul>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Закрыть" severity="secondary" [text]="true" size="small" (onClick)="close()"></p-button>
  </ng-template>
</p-dialog>
